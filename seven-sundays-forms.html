<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sundays Supplemental Forms</title>
<style>:root{font-family:Arial,Helvetica,sans-serif;color:#293b30;background:#fff}*{box-sizing:border-box}body{margin:0;padding:20px}h2{color:#235d39;margin:0 0 8px;font-size:23px}p{line-height:1.55}.info{background:#f1f6f1;border:1px solid #d9e7dc;border-radius:9px;padding:12px 15px;color:#425d49;font-size:14px;margin:12px 0 20px}.warning{background:#fff9ee;border-color:#efddba;color:#654f2b}.field{border:1px solid #dbe4dc;border-radius:10px;padding:15px;margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:10px;line-height:1.4}.field input,.field textarea,.field select{display:block;width:100%;max-width:860px;padding:10px;border:1px solid #b9c9bd;border-radius:7px;background:#fff;font:inherit;color:#26372e}.field textarea{min-height:78px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{border:0;border-radius:8px;padding:11px 16px;background:#245d3a;color:white;font-weight:600;cursor:pointer}button.secondary{background:#ebf1eb;color:#245d3a}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #277444;outline-offset:2px}.small{color:#68796a;font-size:13px}.kml-picker{background:#f6faf6;border:1px solid #d7e4d9;padding:12px;border-radius:8px;margin:0 0 12px}.kml-list{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;margin:10px 0}.kml-list label{display:flex;align-items:center;gap:8px;font-weight:400;margin:0;padding:5px}.kml-list input{width:auto;margin:0}.kml-buttons{display:flex;gap:8px;flex-wrap:wrap}.kml-picker button{padding:8px 12px}.kml-picker button:disabled{opacity:.5;cursor:default}#status{font-size:13px;color:#245d3a;min-height:20px} .choices{display:flex;flex-direction:column;gap:12px}.choice{display:flex!important;align-items:center;gap:12px;font-weight:400!important;margin:0!important}.choice input{width:18px!important;height:18px;flex:none;margin:0}.field .question{font-size:16px}.yield-section{border-top:1px solid #dae6dd;margin-top:18px;padding-top:14px}.yield-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;margin:9px 0}.yield-row input,.yield-row select{min-width:0}.yield-row button{padding:7px 10px}@media(max-width:850px){.yield-row{grid-template-columns:1fr 1fr}.yield-row button{grid-column:1/-1}} </style></head>
<body><main id="form"></main>
<script>
(function(){
'use strict';
const oats=[
 ['Name of Person filling out the form?','text'],
 ['FSA Farm # (all farms and fields is acceptable)','text'],
 ['FSA Tract # (all farms and fields is acceptable)','text'],
 ['FSA Field # (all fields is an acceptable answer)','text'],
 ['Are you using a cover crop BEFORE your oats?','single',['Yes','No']],
 ['Are you using a cover crop AFTER your oats?','single',['Yes','No']],
 ['Are you grazing or haying the cover crop seeded after oats? (or under-seeded with oats)','single',['Yes','No']],
 ['Are you using commercial fertilizer on oats?','single',['Yes','No']],
 ['Are you using a nitrification inhibitor on oats?','single',['Yes','No']],
 ['Are you using manure on oats?','multi',['Beef','Swine','Poultry','Dairy','None']],
 ['Estimate your total N applied per acre?','text'],
 ['What chemical applications do you use on oats?','multi',['Herbicide','Fungicide','Insecticide','Organic','None']],
 ['What tillage do you use on oats?','single',['No-till','Reduced Till (1-pass)','Conventional Till (2 passes)']],
 ['Do you use irrigation on oats?','single',['Yes','No']],
 ['2025 Oat Yield','text'],
 ['Oat Variety, Any Crop Trials, When they enter yield, we need to allow dropdowns to they can keep adding fields, yields, and varieties. Biggest learning, What not to do next year?','textarea']
];
const program=[
 ['Program year','number'],['Available farmer records and evidence','textarea'],['Existing regenerative practices','textarea'],['Planned practice improvements','textarea'],['Program participation notes','textarea']
];
const view=new URLSearchParams(location.search).get('view')==='program'?'program':'oats';
const fields=view==='oats'?oats:program;
const storageKey='seven_sundays_supplement_'+view+(view==='oats'?'_pdf_v2':'_v1');
let values={};try{values=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}
let rows=[];try{rows=JSON.parse(localStorage.getItem(storageKey+'_yieldrows')||'[]')||[]}catch(e){}
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=document.getElementById('form');
const oatsView=view==='oats';
let kmlFields=[];
const instr=`Please answer the questions below on management of your OATS. If you have multiple fields and your oat management does not differ between fields then answer 'all farms and fields' for questions 1-3. If your management does vary between your oat fields then please fill out this questionnaire for each of your oat fields/management types.`;
function optionHtml(label,i,choice,type){const checked=type==='multi'?(Array.isArray(values[i])&&values[i].includes(choice)):values[i]===choice;return '<label class="choice"><input type="'+(type==='multi'?'checkbox':'radio')+'" name="q'+i+'" data-index="'+i+'" value="'+esc(choice)+'" '+(checked?'checked':'')+'><span>'+esc(choice)+'</span></label>'}
function fieldHtml([label,type,choices],i){return '<div class="field"><label class="question" '+((type==='text'||type==='number'||type==='textarea')?'for="q'+i+'"':'')+'>'+(i+1)+'. '+esc(label)+'</label>'+(oatsView&&i===3?'<div class="kml-picker" id="kml-picker"><div class="small" id="kml-status">Checking for field boundaries from Farm Details...</div><div class="kml-list" id="kml-list"></div><div class="kml-buttons"><button type="button" id="kml-apply" disabled>Use selected KML fields</button><button type="button" class="secondary" id="kml-all" disabled>Select all</button></div><p class="small">Select KML fields for question 4, or enter an FSA field number / “all fields” manually. KML field names may not be FSA field numbers.</p></div>':'')+(type==='single'||type==='multi'?'<div class="choices">'+choices.map(v=>optionHtml(label,i,v,type)).join('')+'</div>':type==='textarea'?'<textarea id="q'+i+'" data-index="'+i+'">'+esc(values[i]||'')+'</textarea>':'<input id="q'+i+'" data-index="'+i+'" type="'+type+'" value="'+esc(values[i]||'')+'">')+(oatsView&&i===15?'<div class="yield-section"><strong>Additional field, yield, and variety entries</strong><p class="small">Add as many field-level yield and variety entries as needed.</p><div id="yield-rows"></div><button type="button" class="secondary" id="add-yield-row">+ Add field, yield &amp; variety</button></div>':'')+'</div>'}
host.innerHTML='<h2>'+(oatsView?'2025 AMP Grant Data Requirements':'Seven Sundays • Program requirements and farmer records')+'</h2>'+
 (oatsView?'<p>We are collecting data to better understand on-field practices for our AMP grants and for our brands who are interested in knowing more about our farmers and our story.</p><p>'+esc(instr)+'</p><p>When you submit this form, it will not automatically collect your details like name and email address unless you provide it yourself.</p>':'<p class="info warning">The original supplemental program form was absent from the supplied ZIP. This is a replacement record-keeping form; verify requirements against the program documents.</p>')+
 '<p class="small">Responses save locally in this browser as you type. Export your responses to retain a separate copy.</p>'+
 fields.map(fieldHtml).join('')+
 '<div class="actions"><button type="button" id="export">Export '+(oatsView?'Green Acres Oats':'Program Records')+' Excel Workbook (.xlsx)</button><button class="secondary" type="button" id="clear">Clear answers</button></div><div id="status" role="status"></div>';
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(values));localStorage.setItem(storageKey+'_yieldrows',JSON.stringify(rows));document.getElementById('status').textContent='Saved in this browser.'}catch(e){document.getElementById('status').textContent='Browser storage unavailable. Export a workbook to preserve these answers.'}}
function renderYieldRows(){const el=document.getElementById('yield-rows');if(!el)return;el.innerHTML=rows.map((r,i)=>'<div class="yield-row"><select data-row="'+i+'" data-col="field"><option value="">Select field (or enter below)</option>'+kmlFields.map(f=>'<option value="'+esc(f.name)+'" '+(r.field===f.name?'selected':'')+'>'+esc(f.name)+'</option>').join('')+'</select><input type="text" data-row="'+i+'" data-col="fieldManual" placeholder="FSA field # / field name" value="'+esc(r.fieldManual||'')+'"><input type="text" data-row="'+i+'" data-col="yield" placeholder="2025 oat yield (include units)" value="'+esc(r.yield||'')+'"><input type="text" data-row="'+i+'" data-col="variety" placeholder="Oat variety" value="'+esc(r.variety||'')+'"><button type="button" class="secondary" data-remove-row="'+i+'">Remove</button></div>').join('')}
if(oatsView){
 const status=document.getElementById('kml-status'),list=document.getElementById('kml-list'),apply=document.getElementById('kml-apply'),all=document.getElementById('kml-all');
 function requestFields(){window.parent.postMessage({type:'seven-oats-request-fields'},location.origin==='null'?'*':location.origin)}
 window.addEventListener('message',event=>{
  if(event.source!==window.parent || (event.origin!==location.origin&&location.origin!=='null') || !event.data || event.data.type!=='seven-oats-kml-fields')return;
  kmlFields=Array.isArray(event.data.fields)?event.data.fields.filter(f=>f&&f.name):[];
  const filename=event.data.filename||'';
  status.textContent=kmlFields.length?`${kmlFields.length} fields available from ${filename||'uploaded KML'}. Select the relevant oat fields.`:'No KML fields available. Upload a KML in Farm Details to select fields here.';
  const previously=new Set(String(values[3]||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean));
  list.innerHTML=kmlFields.map((f,i)=>'<label><input type="checkbox" data-kml="'+i+'" '+(previously.has(String(f.name))||(!previously.size&&f.oat)?'checked':'')+'><span>'+esc(f.name)+'</span></label>').join('');
  apply.disabled=all.disabled=!kmlFields.length;
  renderYieldRows();
 });
 apply.addEventListener('click',()=>{const chosen=Array.from(list.querySelectorAll('input[data-kml]:checked')).map(c=>kmlFields[Number(c.dataset.kml)].name);if(!chosen.length){status.textContent='Select one or more fields first.';return}values[3]=chosen.join(', ');document.getElementById('q3').value=values[3];persist();status.textContent=`Added ${chosen.length} field identifier${chosen.length===1?'':'s'} to question 4.`});
 all.addEventListener('click',()=>{list.querySelectorAll('input[data-kml]').forEach(c=>c.checked=true)});
 document.getElementById('add-yield-row').addEventListener('click',()=>{rows.push({field:'',fieldManual:'',yield:'',variety:''});renderYieldRows();persist()});
 renderYieldRows();requestFields();
}
host.addEventListener('input',e=>{if(e.target.dataset.row!==undefined){rows[Number(e.target.dataset.row)][e.target.dataset.col]=e.target.value;persist();return}const index=e.target.dataset.index;if(index===undefined)return;const i=Number(index);if(fields[i][1]==='multi'){let a=Array.isArray(values[i])?values[i].slice():[];if(e.target.checked){if(e.target.value==='None')a=['None'];else{a=a.filter(x=>x!=='None');if(!a.includes(e.target.value))a.push(e.target.value)}}else a=a.filter(x=>x!==e.target.value);values[i]=a;host.querySelectorAll('[name="q'+i+'"]').forEach(c=>{c.checked=a.includes(c.value)})}else values[i]=e.target.value;persist()});
host.addEventListener('click',e=>{if(e.target.dataset.removeRow!==undefined){rows.splice(Number(e.target.dataset.removeRow),1);renderYieldRows();persist()}});
document.getElementById('clear').addEventListener('click',()=>{if(!confirm('Clear all answers in this tab?'))return;values={};rows=[];host.querySelectorAll('[data-index]').forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else e.value=''});renderYieldRows();persist()});
const encode=s=>new TextEncoder().encode(s);
const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
function crc(bytes){let x=0xffffffff;for(const b of bytes){x^=b;for(let k=0;k<8;k++)x=x&1?0xedb88320^(x>>>1):x>>>1}return (x^0xffffffff)>>>0}
function zip(files){let local=[],central=[],offset=0;for(const [name,content] of Object.entries(files)){const n=encode(name),d=typeof content==='string'?encode(content):content,c=crc(d);const header=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...n]);local.push(header,d);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=header.length+d.length}const cat=a=>{const out=new Uint8Array(a.reduce((s,v)=>s+v.length,0));let p=0;for(const v of a){out.set(v,p);p+=v.length}return out};const cd=cat(central);return cat([...local,cd,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(cd.length),...u32(offset),...u16(0)])])}
const xesc=s=>esc(s).replace(/\r/g,'&#13;').replace(/\n/g,'&#10;');
function xcell(col,row,value){return '<c r="'+col+row+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(value)+'</t></is></c>'}
function xlsx(){const sheetRows=[['Question number','Question','Response','Source status'],...fields.map(([label],i)=>[String(i+1),label,Array.isArray(values[i])?values[i].join('; '):String(values[i]||''),oatsView?'2025 AMP Grant Data Requirements (provided PDF)':'Replacement form']),...(oatsView?rows.map((r,i)=>['16.'+(i+1),'Additional oat field / yield / variety', 'Field: '+(r.fieldManual||r.field||'')+' | Yield: '+(r.yield||'')+' | Variety: '+(r.variety||''),'2025 AMP Grant Data Requirements (provided PDF)']):[])];const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="17" customWidth="1"/><col min="2" max="2" width="68" customWidth="1"/><col min="3" max="3" width="80" customWidth="1"/><col min="4" max="4" width="43" customWidth="1"/></cols><sheetData>'+sheetRows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>xcell('ABCD'[j],i+1,v)).join('')+'</row>').join('')+'</sheetData></worksheet>';return zip({'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>','_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+(oatsView?'Green Acres Oats':'Program Records')+'" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>','xl/worksheets/sheet1.xml':sheet})}
document.getElementById('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([xlsx()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download=oatsView?'Green_Acres_Oats_Survey.xlsx':'Seven_Sundays_Program_Records.xlsx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='Excel workbook exported.'});
})();
</script></body></html>
