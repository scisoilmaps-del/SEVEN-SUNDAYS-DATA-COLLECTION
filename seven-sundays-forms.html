<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Sundays Supplemental Forms</title>
<style>:root{font-family:Arial,Helvetica,sans-serif;color:#293b30;background:#fff}*{box-sizing:border-box}body{margin:0;padding:20px}h2{color:#235d39;margin:0 0 8px;font-size:23px}p{line-height:1.55}.info{background:#f1f6f1;border:1px solid #d9e7dc;border-radius:9px;padding:12px 15px;color:#425d49;font-size:14px;margin:12px 0 20px}.warning{background:#fff9ee;border-color:#efddba;color:#654f2b}.field{border:1px solid #dbe4dc;border-radius:10px;padding:15px;margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:10px;line-height:1.4}.field input,.field textarea,.field select{display:block;width:100%;max-width:860px;padding:10px;border:1px solid #b9c9bd;border-radius:7px;background:#fff;font:inherit;color:#26372e}.field textarea{min-height:78px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{border:0;border-radius:8px;padding:11px 16px;background:#245d3a;color:white;font-weight:600;cursor:pointer}button.secondary{background:#ebf1eb;color:#245d3a}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #277444;outline-offset:2px}.small{color:#68796a;font-size:13px}.kml-picker{background:#f6faf6;border:1px solid #d7e4d9;padding:12px;border-radius:8px;margin:0 0 12px}.kml-list{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;margin:10px 0}.kml-list label{display:flex;align-items:center;gap:8px;font-weight:400;margin:0;padding:5px}.kml-list input{width:auto;margin:0}.kml-buttons{display:flex;gap:8px;flex-wrap:wrap}.kml-picker button{padding:8px 12px}.kml-picker button:disabled{opacity:.5;cursor:default}#status{font-size:13px;color:#245d3a;min-height:20px}</style></head>
<body><main id="form"></main>
<script>
(function(){
'use strict';
const oats=[
 ['Grower / farm name','text'],['Primary contact','text'],['Contact email or phone','text'],['Survey or crop year','number'],
 ['Oat acres planted','number'],['Oat fields or field identifiers','textarea'],['Oat variety or varieties planted','text'],['Previous crop in rotation','text'],
 ['Oat planting date','date'],['Seeding rate (include units)','text'],['Tillage and seedbed preparation practices','textarea'],['Cover crop practices associated with the oat rotation','textarea'],
 ['Fertilizer and soil amendment applications (product, rate, timing)','textarea'],['Weed, pest and disease management practices','textarea'],['Harvest date and oat yield (include units)','text'],['Additional notes, challenges or planned changes','textarea']
];
const program=[
 ['Program year','number'],['Available farmer records and evidence','textarea'],['Existing regenerative practices','textarea'],['Planned practice improvements','textarea'],['Program participation notes','textarea']
];
const view=new URLSearchParams(location.search).get('view')==='program'?'program':'oats';
const fields=view==='oats'?oats:program;
const storageKey='seven_sundays_supplement_'+view+'_v1';
let values={};try{values=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=document.getElementById('form');
const oatsView=view==='oats';
host.innerHTML='<h2>'+(oatsView?'Green Acres Oats • Survey':'Seven Sundays • Program requirements and farmer records')+'</h2>'+
 (oatsView?'<p class="info warning"><strong>Restored survey form:</strong> The project ZIP did not contain the original Green Acres Oats questionnaire. These 16 editable questions are a reconstructed replacement, <strong>not verified as the original wording</strong>. Provide the original questionnaire to restore the exact questions.</p>':'<p class="info warning">The original supplemental program form was absent from the supplied ZIP. This is a replacement record-keeping form; verify requirements against the program documents.</p>')+
 '<p class="small">Responses save locally in this browser as you type. Use the export button for an Excel workbook you can retain separately.</p>'+
 fields.map(([label,type],i)=>'<div class="field"><label for="q'+i+'">'+(i+1)+'. '+esc(label)+'</label>'+(oatsView&&i===5?'<div class="kml-picker" id="kml-picker"><div class="small" id="kml-status">Checking for field boundaries from Farm Details...</div><div class="kml-list" id="kml-list"></div><div class="kml-buttons"><button type="button" id="kml-apply" disabled>Use selected KML fields</button><button type="button" class="secondary" id="kml-all" disabled>Select all</button></div><p class="small">Selected field names are copied into the answer below. You can edit them manually afterward.</p></div>':'')+(type==='textarea'?'<textarea id="q'+i+'" data-index="'+i+'">'+esc(values[i]||'')+'</textarea>':'<input id="q'+i+'" data-index="'+i+'" type="'+type+'" value="'+esc(values[i]||'')+'">')+'</div>').join('')+
 '<div class="actions"><button type="button" id="export">Export '+(oatsView?'Green Acres Oats':'Program Records')+' Excel Workbook (.xlsx)</button><button class="secondary" type="button" id="clear">Clear answers</button></div><div id="status" role="status"></div>';
if (oatsView) {
  let kmlFields=[];
  const status=document.getElementById('kml-status');
  const list=document.getElementById('kml-list');
  const apply=document.getElementById('kml-apply');
  const all=document.getElementById('kml-all');
  function requestFields(){window.parent.postMessage({type:'seven-oats-request-fields'},location.origin === 'null'?'*':location.origin)}
  window.addEventListener('message',event=>{
    if (event.source!==window.parent || (event.origin!==location.origin && location.origin!=='null') || !event.data || event.data.type!=='seven-oats-kml-fields') return;
    kmlFields=Array.isArray(event.data.fields)?event.data.fields.filter(f=>f&&f.name):[];
    const filename=event.data.filename || '';
    status.textContent=kmlFields.length?`${kmlFields.length} fields available from ${filename||'uploaded KML'}. Select the oat fields below.`:'No KML field boundaries available. Upload a KML in Farm Details, then return to this survey.';
    const previously=new Set(String(values[5]||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean));
    list.innerHTML=kmlFields.map((f,i)=>'<label><input type="checkbox" data-kml="'+i+'" '+(previously.has(String(f.name))||(!previously.size&&f.oat)?'checked':'')+'><span>'+esc(f.name)+'</span></label>').join('');
    apply.disabled=all.disabled=!kmlFields.length;
  });
  apply.addEventListener('click',()=>{
    const chosen=Array.from(list.querySelectorAll('input[data-kml]:checked')).map(c=>kmlFields[Number(c.dataset.kml)].name);
    if(!chosen.length){status.textContent='Select one or more fields first.';return}
    values[5]=chosen.join('\n');document.getElementById('q5').value=values[5];persist();
    status.textContent=`Added ${chosen.length} field identifier${chosen.length===1?'':'s'} to question 6.`;
  });
  all.addEventListener('click',()=>{list.querySelectorAll('input[data-kml]').forEach(c=>c.checked=true)});
  requestFields();
}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(values));document.getElementById('status').textContent='Saved in this browser.'}catch(e){document.getElementById('status').textContent='Browser storage unavailable. Export a workbook to preserve these answers.'}}
host.addEventListener('input',e=>{const index=e.target.dataset.index;if(index!==undefined){values[index]=e.target.value;persist()}});
document.getElementById('clear').addEventListener('click',()=>{if(!confirm('Clear all answers in this tab?'))return;values={};host.querySelectorAll('[data-index]').forEach(e=>e.value='');persist()});
const encode=s=>new TextEncoder().encode(s);
const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
function crc(bytes){let x=0xffffffff;for(const b of bytes){x^=b;for(let k=0;k<8;k++)x=x&1?0xedb88320^(x>>>1):x>>>1}return (x^0xffffffff)>>>0}
function zip(files){let local=[],central=[],offset=0;for(const [name,content] of Object.entries(files)){const n=encode(name),d=typeof content==='string'?encode(content):content,c=crc(d);const header=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...n]);local.push(header,d);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=header.length+d.length}const cat=a=>{const out=new Uint8Array(a.reduce((s,v)=>s+v.length,0));let p=0;for(const v of a){out.set(v,p);p+=v.length}return out};const cd=cat(central);return cat([...local,cd,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(cd.length),...u32(offset),...u16(0)])])}
const xesc=s=>esc(s).replace(/\r/g,'&#13;').replace(/\n/g,'&#10;');
function xcell(col,row,value){return '<c r="'+col+row+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(value)+'</t></is></c>'}
function xlsx(){const rows=[['Question number','Question','Response','Source status'],...fields.map(([label],i)=>[String(i+1),label,String(values[i]||''),oatsView?'Reconstructed – original unavailable':'Replacement form'])];const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="17" customWidth="1"/><col min="2" max="2" width="68" customWidth="1"/><col min="3" max="3" width="80" customWidth="1"/><col min="4" max="4" width="43" customWidth="1"/></cols><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>xcell('ABCD'[j],i+1,v)).join('')+'</row>').join('')+'</sheetData></worksheet>';return zip({'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>','_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+(oatsView?'Green Acres Oats':'Program Records')+'" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>','xl/worksheets/sheet1.xml':sheet})}
document.getElementById('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([xlsx()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download=oatsView?'Green_Acres_Oats_Survey.xlsx':'Seven_Sundays_Program_Records.xlsx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='Excel workbook exported.'});
})();
</script></body></html>
